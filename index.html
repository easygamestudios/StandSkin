<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StandSkin — кейсы и апгрейд Standoff 2</title>
  <meta name="description" content="Бесплатный симулятор кейсов, апгрейда и контрактов Standoff 2. Голда виртуальная.">
  <meta name="theme-color" content="#0c0e13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8a00'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-weight='900' font-family='Arial' fill='%23111'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* аварийная разметка шапки: работает, даже если внешний файл стилей не загрузился */
    .topbar { display: flex; justify-content: center; height: 64px; }
    .topbar-inner { display: flex; align-items: center; gap: 18px; width: 100%; max-width: 1280px; padding: 0 22px; }
    .nav { display: flex; min-width: 0; overflow-x: auto; }
    .top-right { margin-left: auto; flex-shrink: 0; }
    .balance { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 13px; }
    .g-icon { width: 16px; height: 16px; }
    .balance .g-icon { width: 15px; height: 15px; }
  </style>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
    <a class="logo" href="#/" aria-label="StandSkin — на главную">
      <span class="logo-mark">S</span>
      <span class="logo-text">STAND<b>SKIN</b></span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <a href="#/" data-nav="cases"><span class="nav-ico">▣</span>Кейсы</a>
      <a href="#/upgrade" data-nav="upgrade"><span class="nav-ico">⬆</span>Апгрейд</a>
      <a href="#/contracts" data-nav="contracts"><span class="nav-ico">✦</span>Контракты</a>
      <a href="#/inventory" data-nav="inventory"><span class="nav-ico">▤</span>Инвентарь <span class="nav-count" id="inv-count">0</span></a>
      <a href="#/withdraw" data-nav="withdraw"><span class="nav-ico">↓</span>Вывод</a>
    </nav>
    <div class="top-right">
      <button class="balance" id="balance" type="button" title="Баланс: промокод и пополнение">
        <span class="balance-ico" id="balance-ico"></span>
        <span class="balance-value" id="balance-value">0.00</span>
      </button>
    </div>
    </div>
  </header>

  <section class="live" aria-label="Лента дропов">
    <div class="live-label"><span class="live-dot"></span>LIVE</div>
    <div class="live-track" id="live-track"></div>
  </section>

  <main id="view" class="view"></main>

  <footer class="footer">
    <p><b>StandSkin</b> — бесплатный фанатский симулятор кейсов Standoff 2. Голда здесь виртуальная: её нельзя купить,
      вывести или обменять на реальные деньги и настоящие скины. Проект не связан с Axlebolt.</p>
  </footer>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="textures/manifest.js?v=8"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/art.js?v=8"></script>
  <script src="js/promo.js?v=8"></script>
  <script src="js/core.js?v=8"></script>
  <script src="js/view-cases.js?v=8"></script>
  <script src="js/view-upgrade.js?v=8"></script>
  <script src="js/view-contracts.js?v=8"></script>
  <script src="js/view-inventory.js?v=8"></script>
  <script src="js/view-withdraw.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
</body>
</html>
